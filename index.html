<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gifted Dreamers | $380K in Free Nonprofit Tech Tools</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="We help nonprofits and startups access $380K+ in free tools from Google, Microsoft, Salesforce and 200+ companies, plus accounting cleanup." />
    <meta name="keywords" content="nonprofit technology, tech perks, Google Ad Grants, nonprofit accounting, free enterprise tools, 501c3 resources, nonprofit software, TechSoup alternative, free nonprofit tools" />
    <meta name="author" content="Gifted Dreamers" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://gifteddreamers.org/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gifteddreamers.org/" />
    <meta property="og:title" content="Gifted Dreamers | $380K in Free Nonprofit Tech Tools" />
    <meta property="og:description" content="We help nonprofits access free enterprise tools from Google, Microsoft, Salesforce, and 200+ companies. Tech perks audits starting at $150." />
    <meta property="og:image" content="https://gifteddreamers.org/logo-200.png" />
    <meta property="og:site_name" content="Gifted Dreamers" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://gifteddreamers.org" />
    <meta name="twitter:title" content="Gifted Dreamers | Free Nonprofit Tech Tools" />
    <meta name="twitter:description" content="Access $380K+ in free enterprise tools. Tech perks audits and accounting cleanup for nonprofits." />
    <meta name="twitter:image" content="https://gifteddreamers.org/logo-200.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo-200.png">

    <!-- LCP hero uses responsive srcSet (browser picks size) - no single-image preload to avoid "preloaded but not used" warning -->
    <!-- Preload logo (used in nav) -->
    <link rel="preload" as="image" href="/logo-200.png" fetchpriority="high">

    <!-- DNS Prefetch for third-party domains (non-blocking) -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    <link rel="dns-prefetch" href="https://js.givebutter.com">
    <link rel="dns-prefetch" href="https://widgets.givebutter.com">
    <link rel="dns-prefetch" href="https://doublethedonation.com">
    <!-- DNS Prefetch for Brandfetch CDN (logos are lazy loaded, so preconnect not needed) -->
    <link rel="dns-prefetch" href="https://cdn.brandfetch.io">
    
    <!-- Preconnect to fonts (critical) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load fonts asynchronously to avoid render blocking -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>

    <!-- Structured Data (JSON-LD) for Google Ad Grants -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Gifted Dreamers",
      "legalName": "Gifted Dreamers, Inc.",
      "url": "https://gifteddreamers.org",
      "logo": "https://gifteddreamers.org/logo-200.png",
      "foundingDate": "2024",
      "description": "Gifted Dreamers helps nonprofits and startups access $380K+ in free enterprise tools from Google, Microsoft, Salesforce, and 200+ companies through tech perks audits, accounting cleanup, and workflow automation.",
      "email": "services@gifteddreamers.org",
      "taxID": "39-3863796",
      "nonprofitStatus": "Nonprofit501c3",
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "TX",
        "addressCountry": "US"
      },
      "sameAs": [
        "https://gifteddreamers.substack.com",
        "https://www.linkedin.com/in/kristinesocall",
        "https://givebutter.com/gifteddreamers"
      ],
      "founder": {
        "@type": "Person",
        "name": "Kristine Socall",
        "jobTitle": "Executive Director"
      },
      "knowsAbout": [
        "Google Ad Grants",
        "Nonprofit Technology",
        "TechSoup",
        "Microsoft Nonprofit",
        "Salesforce Nonprofit",
        "QuickBooks"
      ]
    }
    </script>

    <!-- 
      Third-party scripts (analytics, widgets) are now loaded dynamically:
      - After user consent (via CookieConsent component)
      - Or after user interaction (scroll/click/touch) as fallback
      - See lib/analytics-loader.ts for implementation
      
      This improves initial page load performance and respects user privacy.
    -->
    <!-- Critical CSS - Inlined for above-the-fold content (Priority 3) -->
    <!-- Optimized for Google Ad Grants: Fast loading, no layout shift -->
    <style>
      /* Reset and base styles */
      *,*::before,*::after{box-sizing:border-box}
      body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;scroll-behavior:smooth;contain:layout style}
      #root{min-height:100vh;contain:layout style;display:flex;flex-direction:column}
      
      /* Footer fixed height - prevents CLS when content loads */
      footer.bg-slate-900{min-height:1100px!important;height:1100px!important;contain:layout style paint!important;display:block!important;position:relative!important;z-index:1!important;box-sizing:border-box!important;background-color:#0f172a!important;visibility:visible!important;overflow:hidden!important;flex-shrink:0!important}
      /* Static footer placeholder - reserves space before React renders */
      /* Hero image aspect ratio to prevent CLS */
      section.relative img.absolute.inset-0{aspect-ratio:16/9!important;width:100%!important;height:100%!important;object-fit:cover!important}
      body>#root>div.flex{contain:layout style!important;display:flex!important;flex-direction:column!important}
      #root{display:flex!important;flex-direction:column!important;min-height:100vh!important;contain:layout style!important}
      
      /* Hero section critical styles - prevents layout shift */
      section.relative{position:relative}
      img[fetchpriority="high"]{display:block;max-width:100%;height:auto}
      .absolute{position:absolute}
      .inset-0{top:0;right:0;bottom:0;left:0}
      .w-full{width:100%}
      .h-full{height:100%}
      .object-cover{object-fit:cover}
      
      /* Navbar critical styles */
      nav{position:sticky;top:0;z-index:50;background-color:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid #e2e8f0}
      
      /* Prevent FOUC (Flash of Unstyled Content) */
      .flex{display:flex}
      .flex-col{flex-direction:column}
      .min-h-screen{min-height:100vh}
    </style>
  </head>
  <body>
    <div id="root" style="min-height: 100vh; display: flex; flex-direction: column;">
      <!-- Content will be inserted here by React -->
    </div>
    <!-- Load main bundle -->
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
